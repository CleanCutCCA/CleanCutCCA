
<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join CCA Updates | CleanCut CCA</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="menu-toggle" aria-label="Open menu">&#9776;</button>

<div id="menu-overlay"></div>

<nav id="menu-panel">
    <button id="menu-close" aria-label="Close menu">&#10005;</button>
    <a href="index.html">HOME</a>
    <a href="register.html">REGISTER YOUR CARD</a>
    <a href="contact.html">CONTACT US</a>
    <a href="updates.html">JOIN CCA UPDATES</a>
</nav>

<div class="page-header">
    <a href="index.html" class="home-link">&larr; Back to Registry</a>
    <img src="images/logo.png" alt="CleanCut CCA Logo">
    <h1>Join CCA Updates</h1>
    <div class="header-divider"></div>
</div>

<div class="form-wrap">
    <form id="updates-form">

        <div class="form-field">
            <label for="upd-name">Name</label>
            <input type="text" id="upd-name" name="name" required>
        </div>

        <div class="form-field">
            <label for="upd-email">Email</label>
            <input type="email" id="upd-email" name="email" required>
        </div>

        <button type="submit" class="form-submit">Join</button>

        <div class="form-note" id="updates-note">
            Be the first to know about new releases and registry updates.
        </div>

    </form>
</div>

<script src="script.js"></script>
<script>
document.getElementById('updates-form').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('updates-note').textContent = 'You\'re on the list. Thank you for joining.';
    this.reset();
});
</script>

</body>
</html>
