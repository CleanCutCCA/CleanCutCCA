<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CleanCut CCA | Official Collector Registry</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="menu-toggle" aria-label="Open menu">&#9776;</button>

<div id="menu-overlay"></div>

<nav id="menu-panel">
    <button id="menu-close" aria-label="Close menu">&#10005;</button>
    <a href="index.html">HOME</a>
    <a href="register.html">REGISTER YOUR CARD</a>
    <a href="contact.html">CONTACT US</a>
    <a href="updates.html">JOIN CCA UPDATES</a>
</nav>

<div id="splash">
    <img src="images/logo.png" alt="CleanCut CCA Logo">
</div>

<div class="site-header-block">

    <img src="images/logo.png" alt="CleanCut CCA Logo">

    <div class="tagline">ONE DESIGN &bull; ONE OWNER</div>

    <div class="header-divider"></div>

    <div class="registry-tag">Official Collector Registry</div>

</div>

<h2>Season 1</h2>
<div class="sub">Original Release &bull; 8 Cards</div>
<div class="grid" id="season1-grid"></div>

<hr>

<h2>Season 2</h2>
<div class="sub">Manga Collection &bull; 40 Cards</div>
<div class="grid" id="season2-grid"></div>

<hr>

<h2>Season 3</h2>
<div class="sub">Coming Soon</div>

<!-- ---------- CARD MODAL ---------- -->

<div id="card-modal-overlay"></div>

<div id="card-modal" role="dialog" aria-modal="true">
    <button id="card-modal-close" aria-label="Close">&#10005;</button>
    <div class="modal-image-wrap">
        <img id="modal-img" src="" alt="">
    </div>
    <div class="modal-info">
        <div class="modal-season" id="modal-season"></div>
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="modal-divider"></div>
        <div class="modal-serial" id="modal-serial"></div>

        <div class="modal-fields">
            <div class="modal-field">
                <div class="modal-field-label">CURRENT OWNER</div>
                <div class="modal-field-value" id="modal-owner"></div>
            </div>
            <div class="modal-field">
                <div class="modal-field-label">RELEASE PRICE</div>
                <div class="modal-field-value" id="modal-price"></div>
            </div>
            <div class="modal-field">
                <div class="modal-field-label">LAST VERIFIED SALE</div>
                <div class="modal-field-value" id="modal-sale"></div>
            </div>
            <div class="modal-field">
                <div class="modal-field-label">REGISTRY STATUS</div>
                <div class="modal-field-value" id="modal-status"></div>
            </div>
            <div class="modal-field">
                <div class="modal-field-label">RELEASE DATE</div>
                <div class="modal-field-value" id="modal-date"></div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
